# Scrapes monthly listeners once a day and commits the snapshot, so the repo
# builds up its own history over time. Needs no Spotify credentials: the
# scraper only reads a public page.
name: Daily scrape

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily (an off-peak minute, to be polite)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # to commit the new snapshot

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests (offline)
        run: python -m pytest -q

      - name: Scrape
        run: python -m tracker scrape --top 500

      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listeners
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Monthly listeners snapshot $(date -u +%F)"
            git push
          fi
